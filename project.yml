name: Zwischenzeit
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: de
  createIntermediateGroups: true
# Bundle ID prefix, team and App Group come from here (override in Config/Local.xcconfig).
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Simulator builds sign ad hoc; device builds use the team's Apple Development certificate.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      # No @testable access, whole-module optimisation, stripped binaries with separate dSYMs.
      ENABLE_TESTABILITY: NO
      SWIFT_COMPILATION_MODE: wholemodule
      STRIP_INSTALLED_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  ZwischenzeitKit:
    path: Packages/ZwischenzeitKit

targets:
  Zwischenzeit:
    type: application
    platform: iOS
    sources: [App/iOS]
    dependencies:
      - package: ZwischenzeitKit
        products: [DesignSystem, Domain, MockAPI, LiveAPI, CalendarFeature, AppointmentFeature, SettingsFeature, WatchSync, WatchUI]
      - target: ZwischenzeitWatch
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Zwischenzeit
        CFBundleDevelopmentRegion: de
        UILaunchScreen: {}
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).watchsync"]
        NSFaceIDUsageDescription: Die App wird mit Face ID entsperrt, damit Termine nicht für andere sichtbar sind.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  ZwischenzeitWatch:
    type: application
    platform: watchOS
    sources: [App/Watch]
    dependencies:
      - package: ZwischenzeitKit
        products: [DesignSystem, Domain, WatchSync, WatchUI]
      - target: ZwischenzeitWatchWidgets
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: Zwischenzeit
        CFBundleDevelopmentRegion: de
        WKApplication: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKCompanionAppBundleIdentifier: "$(APP_BUNDLE_ID)"
        AppGroupID: "$(APP_GROUP_ID)"
    entitlements:
      path: App/Watch/Watch.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).watchkitapp"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"

  ZwischenzeitWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [App/WatchWidgets]
    dependencies:
      - package: ZwischenzeitKit
        products: [Domain, WatchSync, WatchUI]
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: App/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Nächster Termin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: "$(APP_GROUP_ID)"
    entitlements:
      path: App/WatchWidgets/WatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).watchkitapp.widgets"
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  Zwischenzeit:
    build:
      targets:
        Zwischenzeit: all
    run:
      config: Debug
    test:
      config: Debug
  ZwischenzeitWatch:
    build:
      targets:
        ZwischenzeitWatch: all
    run:
      config: Debug
