# Dependabot version updates. Security updates are enabled in the repository settings.
version: 2
updates:
  # GitHub Actions are pinned by commit SHA; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ZwischenzeitKit has no third-party dependencies by policy. This entry catches any that get added.
  - package-ecosystem: swift
    directory: /Packages/ZwischenzeitKit
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies", "swift"]
