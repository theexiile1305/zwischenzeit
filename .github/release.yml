# Categories for GitHub's generated release notes (by pull request label).
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Security
      labels: ["security"]
    - title: New features
      labels: ["enhancement"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
