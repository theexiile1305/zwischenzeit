name: Bug report
description: Something does not work as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not include patient data, real names, notes, credentials,
        tokens or screenshots of live data.** Reproduce with `-mockAPI` where you can.
        Security problems go through [SECURITY.md](https://github.com/theexiile1305/zwischenzeit/blob/main/SECURITY.md), not here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no patient data, real names, credentials or tokens.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the week view
        2. Tap on …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data source
      options:
        - Mock data (-mockAPI)
        - Live TTools backend
        - Both
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iPhone
        - iPad
        - Apple Watch app
        - Watch complication / widget
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0 or a1b2c3d
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Device and OS version
      placeholder: iPhone 16, iOS 26.1 / Apple Watch Series 10, watchOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Mock data only. Remove anything that could identify a person.
      render: text
