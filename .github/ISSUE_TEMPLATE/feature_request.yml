name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please keep examples free of patient data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the situation in the practice.
      placeholder: Between two patients I want to see …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could the app help? Sketches welcome (mock data only).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iPhone
        - iPad
        - Apple Watch
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This feature does not need to create, change or delete data in TTools (the app is read-only except for documentation text).
          required: true
